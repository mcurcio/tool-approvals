{% extends "base.html" %}
{% block head %}<script src="{{ push.script }}" defer></script>
{% endblock %}
{% block main %}
<h1>{{ title }}</h1>
<section id="push" data-application-server-key="{{ push.application_server_key }}" data-push-token="{{ push.token }}" data-subscriptions="{{ push.subscriptions }}" data-service-worker="{{ push.service_worker }}" data-service-worker-scope="{{ push.service_worker_scope }}">
<p>
<button type="button" id="push-on" hidden>Notify this browser</button>
<button type="button" id="push-off" hidden>Stop notifying this browser</button>
</p>
<p id="push-status" role="status"></p>
</section>
{% if list_page %}
<p><a href="{{ list_page }}">Waiting for your answer</a></p>
{% endif %}
{% endblock %}
