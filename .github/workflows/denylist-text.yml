# Deny-list check for text written on the repository outside commits: issues, comments, reviews, and later
# edits of a pull request's title or body. Only text by an owner, member or collaborator is scanned; anyone
# else's text would turn the check into an oracle for the list. The text reaches the scanner only through
# `env:`, and the scanner runs quietly: the job result is the only output.
name: Deny-list text

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request:
    types: [edited]

permissions:
  contents: read

env:
  UV_VERSION: 0.13.5

jobs:
  scan:
    name: Deny-list text
    # The author of the text in this event: a comment, else a review, else the issue or pull request itself.
    # Pull request events from a fork get no secrets, so they are skipped, as in ci.yml.
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.comment.author_association || github.event.review.author_association
      || github.event.issue.author_association || github.event.pull_request.author_association)
      && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Scan
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          TEXT_TITLE: >-
            ${{ (github.event_name == 'issues' && github.event.issue.title)
            || (github.event_name == 'pull_request' && github.event.pull_request.title) || '' }}
          TEXT_BODY: >-
            ${{ github.event.comment.body || github.event.review.body
            || (github.event_name == 'issues' && github.event.issue.body)
            || (github.event_name == 'pull_request' && github.event.pull_request.body) || '' }}
        run: |
          if [ -z "$DENYLIST" ]; then exit 2; fi
          umask 077
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist-words"
          unset DENYLIST
          uv run --no-project scripts/denylist.py --quiet --words "$RUNNER_TEMP/denylist-words" text TEXT_TITLE TEXT_BODY
