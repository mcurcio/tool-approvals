# Checks on every pull request and every push to main. On a push to main that passes them, the release job runs
# semantic-release (.releaserc.json): Conventional Commit types decide the version, the tag holds it.
name: CI

on:
  push:
    branches: [main]
  # A later edit of a pull request's title or body is scanned by denylist-text.yml.
  pull_request:

permissions:
  contents: read

# Exact tool versions, one place each. Actions are pinned by full commit sha (tag in the comment).
env:
  UV_VERSION: 0.13.5

jobs:
  check:
    name: Lint, types, import contracts, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked lint-imports
      - run: uv run --locked pytest -n auto

  # Refuses a listed word in the commits, the tree, the branch name, or the pull request's title and body.
  # The list is the DENYLIST secret (a Dependabot secret of the same value serves Dependabot's pull requests);
  # untrusted text reaches the scanner only through `env:`. Output names the kind of hit, never the word.
  # Pull requests from forks are not scanned: they get no secrets, and a result would reveal the list.
  denylist:
    name: Deny-list check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Write the word list
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "::error::The DENYLIST secret is not set"
            exit 2
          fi
          umask 077
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist-words"
      - name: Scan the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          rc=0
          scan() {
            local status=0
            uv run --no-project scripts/denylist.py --words "$RUNNER_TEMP/denylist-words" "$@" || status=$?
            if [ "$status" -gt "$rc" ]; then rc=$status; fi
          }
          scan commits "$BASE_SHA..$HEAD_SHA"
          scan ref HEAD_REF
          scan text PR_TITLE PR_BODY
          exit "$rc"
      - name: Scan the push and the tree
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUSHED_REF: ${{ github.ref_name }}
        run: |
          rc=0
          scan() {
            local status=0
            uv run --no-project scripts/denylist.py --words "$RUNNER_TEMP/denylist-words" "$@" || status=$?
            if [ "$status" -gt "$rc" ]; then rc=$status; fi
          }
          # A new branch, or a base the push rewrote, has no usable base: scan the whole history.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            scan commits "$BEFORE..$AFTER"
          else
            scan commits "$AFTER"
          fi
          scan tree "$AFTER"
          scan ref PUSHED_REF
          exit "$rc"

  # Placeholder until the end-to-end harness lands; the release already waits on it.
  e2e:
    name: End-to-end (placeholder)
    runs-on: ubuntu-latest
    steps:
      - run: echo "No end-to-end suite yet."

  release:
    name: Release (semantic-release)
    needs: [check, denylist, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    # contents: write is needed in dry-run too: semantic-release always checks push access.
    # Comments, labels and failure issues are off in .releaserc.json, so no issues or pull-requests scope.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no-install semantic-release
