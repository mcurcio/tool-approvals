# Checks on every pull request and every push to main. On a push to main that passes them, the release job runs
# semantic-release (.releaserc.json): Conventional Commit types decide the version, the tag holds it.
name: CI

on:
  push:
    branches: [main]
  # A later edit of a pull request's title or body is scanned by denylist-text.yml.
  pull_request:

permissions:
  contents: read

# Exact tool versions, one place each. Actions are pinned by full commit sha (tag in the comment).
env:
  UV_VERSION: 0.13.5

jobs:
  check:
    name: Lint, types, import contracts, contract, tests
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: buf breaking compares against the latest release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked lint-imports
      # Expand migrations only add what the release still serving can live with (expand-then-contract).
      - run: uv run --locked python scripts/check_migrations.py
      # The committed wire stubs match proto/ and vendor/ under the locked grpcio-tools and mypy-protobuf.
      - run: uv run --locked python scripts/generate_contract.py --check
      - run: uv run --locked pytest -n auto
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The release rules (.releaserc.json) through the pinned commit-analyzer: what each title type releases.
      - run: node --test tests/release_rules.test.mjs
      # The protobuf module (buf.yaml): lint STANDARD, canonical format, and no breaking change since the last release.
      - run: npx --no-install buf lint
      - run: npx --no-install buf format --diff --exit-code
      - name: buf breaking against the latest release tag
        run: |
          tags=$(git tag --list 'v*' --sort=-v:refname)
          if [ -z "$tags" ]; then
            echo "No v* tag yet: nothing released to break."
            exit 0
          fi
          latest=$(printf '%s\n' "$tags" | head -n 1)
          # A release made before the protobuf module existed has no contract to break.
          if ! git cat-file -e "$latest:buf.yaml" 2>/dev/null; then
            git rev-parse --verify --quiet "$latest^{commit}" > /dev/null
            echo "$latest has no buf.yaml: nothing released to break."
            exit 0
          fi
          npx --no-install buf breaking --against ".git#tag=$latest"

  # Refuses a listed word in the commits, the tree, the branch name, or the pull request's title and body.
  # The scanner is scripts/denylist.py, vendored unchanged from the maintainers' copy (tests/test_denylist_copy.py
  # pins it; its behaviour tests live upstream with the maintainers' tooling):
  # `denylist.py commits <range>` and `denylist.py tree <path>`, the word list on stdin, exit 0 clean, 1 hit (a
  # listed word, or a compressed or archive file it cannot read), 2 setup failure; it names the kind of hit, never
  # the word. The list is the DENYLIST secret (a Dependabot secret
  # of the same value serves Dependabot's pull requests) and reaches the scanner only through `env:` and stdin, as
  # does every piece of pull request text. Pull requests from forks are not scanned: they get no secrets, and a
  # result would reveal the list.
  denylist:
    name: Deny-list check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Scan
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "::error::The DENYLIST secret is not set"
            exit 2
          fi
          rc=0
          scan() {
            local status=0
            printf '%s\n' "$DENYLIST" | uv run --no-project scripts/denylist.py "$@" || status=$?
            if [ "$status" -gt "$rc" ]; then rc=$status; fi
          }
          # The branch name, title and body, each as one file of a fresh directory.
          text="$RUNNER_TEMP/denylist-text"
          mkdir -m 700 "$text"
          printf '%s' "$HEAD_REF" > "$text/ref"
          printf '%s' "$PR_TITLE" > "$text/title"
          printf '%s' "$PR_BODY" > "$text/body"
          scan tree "$text"
          if [ "$EVENT" = pull_request ]; then
            scan commits "$BASE_SHA..$HEAD_SHA"
          else
            # A new branch, or a base the push rewrote, has no usable base: scan the whole history.
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              scan commits "$BEFORE..$AFTER"
            else
              scan commits "$AFTER"
            fi
            scan tree .
          fi
          exit "$rc"

  # The image built from this commit (amd64, loaded into the runner's Docker), then tests/e2e against it: the
  # compose stack of tests/e2e/compose.yaml with both gateways. The unit run in `check` skips these tests.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image from this commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tool-approvals:e2e
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - run: uv run --locked pytest -n auto tests/e2e
        env:
          TOOL_APPROVALS_E2E_IMAGE: tool-approvals:e2e

  release:
    name: Release (semantic-release)
    needs: [check, denylist, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    # contents: write is needed in dry-run too: semantic-release always checks push access.
    # Comments, labels and failure issues are off in .releaserc.json, so no issues or pull-requests scope.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # With no v* tag semantic-release would cut 1.0.0; the 0.x line starts from a seed tag pushed once by hand.
      - name: Require the seed tag
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            echo "::error::No v* tag exists, so a release would be 1.0.0. A maintainer must push the seed tag v0.1.0 once before the first release."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no-install semantic-release

  # The multi-arch image, pushed after the release job on every push to main: tagged `main` and `sha-<short sha>`,
  # and on a release also `<version>` and `latest`, with build provenance attached.
  image:
    name: Image
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.version != '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=image
