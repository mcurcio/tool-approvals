# Checks on every pull request and every push to main. On a push to main that passes them, the release job runs
# semantic-release (.releaserc.json): Conventional Commit types decide the version, the tag holds it, and the release
# notes go on the GitHub Release and into CHANGELOG.md. CHANGELOG.md is the only file the release commits back to main,
# in a `chore(release): <version> [skip ci]` commit on top of the tested one, which the tag points at.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Exact tool versions, one place each. Actions are pinned by full commit sha (tag in the comment).
env:
  UV_VERSION: 0.13.5
  ACTIONLINT_VERSION: v1.7.12

jobs:
  check:
    name: Lint, types, import contracts, contract, tests
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: buf breaking compares against the latest release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # The workflows themselves (with shellcheck on their scripts), at a pinned release built by the runner's Go,
      # which verifies the module against the Go checksum database.
      - run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked lint-imports
      # Expand migrations only add what the release still serving can live with (expand-then-contract).
      - run: uv run --locked python scripts/check_migrations.py
      # The committed wire stubs match proto/ and vendor/ under the locked grpcio-tools and mypy-protobuf.
      - run: uv run --locked python scripts/generate_contract.py --check
      - run: uv run --locked pytest -n auto
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The release rules (.releaserc.json) through the pinned commit-analyzer: what each title type releases.
      - run: node --test tests/release_rules.test.mjs
      # The protobuf module (buf.yaml): lint STANDARD, canonical format, and no breaking change since the last release.
      - run: npx --no-install buf lint
      - run: npx --no-install buf format --diff --exit-code
      - name: buf breaking against the latest release tag
        run: |
          tags=$(git tag --list 'v*' --sort=-v:refname)
          if [ -z "$tags" ]; then
            echo "No v* tag yet: nothing released to break."
            exit 0
          fi
          latest=$(printf '%s\n' "$tags" | head -n 1)
          # A release made before the protobuf module existed has no contract to break.
          if ! git cat-file -e "$latest:buf.yaml" 2>/dev/null; then
            git rev-parse --verify --quiet "$latest^{commit}" > /dev/null
            echo "$latest has no buf.yaml: nothing released to break."
            exit 0
          fi
          npx --no-install buf breaking --against ".git#tag=$latest"

  # The image built from this commit (amd64, loaded into the runner's Docker), then tests/e2e and
  # tests/conformance against it: the compose stack of tests/e2e/compose.yaml with both gateways. The unit run in
  # `check` skips these tests.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image from this commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tool-approvals:e2e
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - run: uv run --locked pytest -n auto tests/e2e tests/conformance
        env:
          TOOL_APPROVALS_E2E_IMAGE: tool-approvals:e2e

  release:
    name: Release (semantic-release)
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    # contents: write is needed in dry-run too: semantic-release always checks push access. It also lets the git
    # plugin push the CHANGELOG.md commit to main: semantic-release pushes with GITHUB_TOKEN through its own
    # authenticated URL, so the checkout keeps persist-credentials: false. A branch protection rule or ruleset on main
    # must let this workflow's GITHUB_TOKEN push that commit, or the release fails before it tags anything.
    # A push made with GITHUB_TOKEN starts no workflow run, and the commit's [skip ci] says so as well.
    # Comments, labels and failure issues are off in .releaserc.json, so no issues or pull-requests scope.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # With no version tag reachable from HEAD semantic-release would cut 1.0.0, so the first release run seeds the
      # 0.x line: it creates v0.1.0 on the repository's root commit (a lightweight tag, as semantic-release makes)
      # through the GitHub API with this job's token, and mirrors the tag locally for semantic-release. The release
      # concurrency group serializes runs, so a v0.1.0 that already exists on GitHub was made by hand or by an
      # earlier attempt of this run; it counts as success when it (peeled, if annotated) points at the root commit.
      # Any other failure fails the job.
      - name: Seed the 0.x line
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_TAG: v0.1.0
        run: |
          # The version tags semantic-release counts: tagFormat v${version}, reachable from HEAD.
          if [ -n "$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "A version tag is reachable from HEAD: no seed needed."
            exit 0
          fi
          roots=$(git log --max-parents=0 --format='%ct %H' HEAD | sort -n | cut -d' ' -f2)
          root=$(printf '%s\n' "$roots" | head -n 1)
          if [ "$(printf '%s\n' "$roots" | wc -l)" -gt 1 ]; then
            echo "::warning::Several root commits; seeding $SEED_TAG on the oldest, $root."
          fi
          if ! gh api --silent "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$SEED_TAG" -f sha="$root" 2> "$RUNNER_TEMP/seed.err"; then
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SEED_TAG" --jq '.object.type + " " + .object.sha') || {
              cat "$RUNNER_TEMP/seed.err" >&2
              exit 1
            }
            type=${ref%% *}
            existing=${ref#* }
            if [ "$type" = tag ]; then
              existing=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq '.object.sha') || exit 1
            fi
            if [ "$existing" != "$root" ]; then
              cat "$RUNNER_TEMP/seed.err" >&2
              echo "::error::$SEED_TAG exists on GitHub at $existing, not at the root commit $root."
              exit 1
            fi
            echo "$SEED_TAG already exists at $root (made by hand or by an earlier attempt)."
          fi
          git tag "$SEED_TAG" "$root"
          echo "Seeded $SEED_TAG on $root."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no-install semantic-release

  # The multi-arch image, pushed after the release job on every push to main: tagged `main` and `sha-<short sha>`,
  # and on a release also `<version>` and `latest`, with build provenance attached. It is built from the commit the
  # release tagged, checked out by the tag: the pushed commit itself, or the release commit on top of it that changes
  # only CHANGELOG.md (which .dockerignore leaves out of the build context).
  image:
    name: Image
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag || github.sha }}
          # The tagged commit and its parent, for the check below.
          fetch-depth: 2
          persist-credentials: false
      # The checkout is the commit this run tested, or the release commit made directly on top of it whose only change
      # is CHANGELOG.md. Anything else fails the job.
      - name: The checkout is the commit this run tested
        env:
          TESTED: ${{ github.sha }}
        run: |
          built=$(git rev-parse HEAD)
          if [ "$built" = "$TESTED" ]; then
            exit 0
          fi
          parents=$(git rev-list --parents -n 1 "$built" | cut -d' ' -f2-)
          if [ "$parents" != "$TESTED" ]; then
            echo "::error::The release tag points at $built, whose parent is not the tested commit $TESTED"
            exit 1
          fi
          changed=$(git diff --no-renames --name-only "$TESTED" "$built")
          if [ "$changed" != CHANGELOG.md ]; then
            echo "::error::The release commit $built must change only CHANGELOG.md; it changes: ${changed//$'\n'/ }"
            exit 1
          fi
          echo "The release commit $built adds only CHANGELOG.md to the tested commit $TESTED."
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.version != '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=image
