# The e2e stack. tests/e2e/stack.py renders every file under ${E2E_DIR} (configuration, certificates, bearers,
# gateway configurations) and runs this file as its own compose project; nothing here is used by hand.
#   TOOL_APPROVALS_E2E_IMAGE  the image built from this commit (never pulled: a wrong tag fails, it does not fall back)
#   E2E_DIR                   the rendered directory: mounted/ read-only into every container, records/ for the echo tool
#   DESK_PORT                 the host port of the desk's public URL (named in the configuration, so fixed up front)
# Every published port binds 127.0.0.1 on a port Docker picks; the harness asks compose which.

x-tool-approvals: &tool-approvals
  image: ${TOOL_APPROVALS_E2E_IMAGE:?the image built from this commit}
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    TOOL_APPROVALS_CONFIG: /e2e/config.yaml
  volumes:
    - ${E2E_DIR:?the rendered directory}/mounted:/e2e:ro
  extra_hosts:
    - host.docker.internal:host-gateway # the scripted IdP and the gate relay run on the host

x-ready: &ready
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz')"]
  interval: 1s
  timeout: 2s
  retries: 60

services:
  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: approvals
      POSTGRES_DB: approvals
      POSTGRES_PASSWORD_FILE: /e2e/secrets/postgres-password
    volumes:
      - ${E2E_DIR:?}/mounted:/e2e:ro
    tmpfs:
      - /var/lib/postgresql
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "approvals", "-d", "approvals"]
      interval: 1s
      timeout: 2s
      retries: 60

  migrate:
    <<: *tool-approvals
    command: [approvals, migrate]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  approvals:
    <<: *tool-approvals
    command: [approvals, serve]
    ports: ["127.0.0.1:${DESK_PORT:?}:8080"] # the desk, at its configured public URL
    healthcheck: *ready
    depends_on:
      migrate: { condition: service_completed_successfully }

  gate:
    <<: *tool-approvals
    command: [gate]
    ports: ["127.0.0.1::8443", "127.0.0.1::9444", "127.0.0.1::9445"] # Check API (JSON), ext_mcp, ext_authz
    healthcheck: *ready

  wait:
    <<: *tool-approvals
    command: [wait]
    healthcheck: *ready

  echo:
    <<: *tool-approvals
    entrypoint: [python, /opt/echo/echo_tool.py, --records, /records]
    command: []
    volumes:
      - ../fixtures/echo_tool.py:/opt/echo/echo_tool.py:ro
      - ${E2E_DIR:?}/records:/records
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 1s
      timeout: 2s
      retries: 60

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    command: [-f, /e2e/agentgateway.yaml]
    read_only: true
    volumes:
      - ${E2E_DIR:?}/mounted:/e2e:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports: ["127.0.0.1::3000", "127.0.0.1::15021"] # MCP, readiness
    depends_on:
      echo: { condition: service_healthy }

  envoy:
    image: envoyproxy/envoy:v1.40.2@sha256:8de97e654644827d62afdbf7e1d3dc9fee01a8690d410dd1c63a30dc6b6cecbb
    command: [-c, /e2e/envoy.json]
    volumes:
      - ${E2E_DIR:?}/mounted:/e2e:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports: ["127.0.0.1::10000", "127.0.0.1::9901"] # MCP, admin (readiness)
    depends_on:
      echo: { condition: service_healthy }
