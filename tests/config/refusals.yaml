# Each case edits examples/config.yaml (which passes `config check`) and names the problems the refusal lists, in
# order: each expected text is part of its problem, and there are exactly as many problems as expected texts.
#   set:     {path: value}   a dotted path; a list index is a number, one past the end appends
#   delete:  [path]
#   command: config | gate | wait | approvals | migrate   (default config: `config check`, no secret resolved)
#   env:     the environment the command's view resolves secrets from
- name: requirement below the floor's level
  set: { requirements.reviewed.min_assurance: password }
  expect: ["requirements.reviewed: below the floor"]

- name: requirement below the floor's sign-in age
  set: { requirements.reviewed.max_sign_in_age: 10m }
  expect: ["requirements.reviewed: below the floor"]

- name: unknown level in a requirement
  set: { requirements.reviewed.min_assurance: hardware-key }
  expect: ["requirements.reviewed.min_assurance: unknown assurance level 'hardware-key'"]

- name: unknown level in the floor
  set: { floor.min_assurance: hardware-key }
  expect: ["floor.min_assurance: unknown assurance level 'hardware-key'"]

- name: unknown level as a surface cap
  set: { surfaces.0.cap: hardware-key }
  expect: ["surfaces.desk.cap: unknown assurance level 'hardware-key'"]

- name: unknown surface in a requirement
  set: { requirements.reviewed.allowed_surfaces: [desk, chat] }
  expect: ["requirements.reviewed.allowed_surfaces: unknown surface 'chat'"]

- name: unknown requirement in a policy rule
  set: { gate.policy.rules.0.require: admin }
  expect: ["gate.policy.rules[0].require: unknown requirement 'admin'"]

- name: unknown requirement as the policy default
  set: { gate.policy.default: admin }
  expect: ["gate.policy.default: unknown requirement 'admin'"]

- name: a repeated level name
  set: { assurance.2: { name: passkey, acr: ["3"] } }
  expect: ["assurance: the level 'passkey' is named twice"]

- name: a repeated acr
  set: { assurance.1.acr: ["1", "urn:example:acr:passkey"] }
  expect: ["assurance: the acr '1' is listed twice"]

- name: a surface cap below the minimum of a requirement allowing it
  set: { surfaces.0.cap: password }
  expect: ["requirements.reviewed: the surface 'desk' it allows caps at 'password', below its minimum 'passkey'"]

- name: a native surface not binding the digest
  set: { surfaces.0.binds_digest: false }
  expect: ["surfaces.desk: a native surface must bind the digest"]

- name: a repeated surface name
  set: { surfaces.2: { name: desk, kind: native, cap: passkey } }
  expect: ["surfaces: the surface 'desk' is named twice"]

- name: desk.surface not a known surface
  set: { approvals.desk.surface: chat }
  expect: ["approvals.desk.surface: unknown surface 'chat'"]

- name: a surface kind other than native or integrated
  set: { surfaces.0.kind: chat }
  expect: ["surfaces[0].kind: Input should be 'native' or 'integrated'"]

- name: one bearer hash on two entries
  set: { registry.1.credential.bearer_sha256: 1f0b6c6e2a2d4b5f8e9a0c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f7 }
  expect: ["registry: one bearer hash on two entries (gateway-hook, gate)"]

- name: an unknown method
  set: { registry.0.grants: [check, desk.answer] }
  expect: ["registry[0].grants[1]: Input should be 'check', 'requests.request'"]

- name: a bearer hash that is not 64 hex digits
  set: { registry.0.credential.bearer_sha256: "sha256:1f0b" }
  expect: ["registry[0].credential.bearer_sha256: a SHA-256 is 64 hex digits"]

- name: a client-certificate fingerprint that is not 64 hex digits
  set:
    registry.0.credential: { client_cert_sha256: "AB:CD" }
    gate.check_api.grpc.tls.client_ca: /etc/tool-approvals/gateway-ca.pem
  expect: ["registry[0].credential.client_cert_sha256: a SHA-256 is 64 hex digits"]

- name: a credential naming both a bearer and a client certificate
  set:
    registry.0.credential:
      bearer_sha256: 1f0b6c6e2a2d4b5f8e9a0c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f7
      client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d
  expect: ["registry[0].credential: a credential names exactly one of bearer_sha256 or client_cert_sha256"]

- name: a credential naming neither
  set: { registry.0.credential: { sha256: 1f0b6c6e2a2d4b5f8e9a0c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f7 } }
  expect: ["registry[0].credential: a credential names exactly one of bearer_sha256 or client_cert_sha256"]

- name: a credential that is not a mapping
  set: { registry.0.credential: 1f0b6c6e2a2d4b5f8e9a0c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f7 }
  expect: ["registry[0].credential: a credential is {bearer_sha256: HEX} or {client_cert_sha256: HEX}"]

- name: one client certificate on two entries
  set:
    registry.0.credential: { client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d }
    registry.3.credential: { client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d }
    gate.check_api.grpc.tls.client_ca: /etc/tool-approvals/gateway-ca.pem
    wait.listeners.mcp.tls.client_ca: /etc/tool-approvals/gateway-ca.pem
  expect: ["registry: one client certificate on two entries (gateway-hook, gateway-wait-route)"]

- name: a client certificate granted a method a gateway does not call
  set:
    registry.1.credential: { client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d }
    approvals.listeners.requests.tls.client_ca: /etc/tool-approvals/gate-ca.pem
  expect: ["registry.gate: a client-certificate credential is accepted only for check and wait.call"]

- name: a client certificate granted check and a method a gateway does not call
  set:
    registry.0.credential: { client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d }
    registry.0.grants: [check, requests.request]
    gate.check_api.grpc.tls.client_ca: /etc/tool-approvals/gateway-ca.pem
  expect: ["registry.gateway-hook: a client-certificate credential is accepted only for check and wait.call"]

- name: a client certificate where no listener asks for one
  set: { registry.0.credential: { client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d } }
  expect:
    - "registry.gateway-hook: a client-certificate credential, but no listener serving its grants asks for client certificates (tls.client_ca)"

- name: a client certificate granted check where only the wait server asks for one
  set:
    registry.0.credential: { client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d }
    wait.listeners.mcp.tls.client_ca: /etc/tool-approvals/gateway-ca.pem
  expect:
    - "registry.gateway-hook: a client-certificate credential, but no listener serving its grants asks for client certificates (tls.client_ca)"

- name: a client certificate granted wait.call where only the gate asks for one
  set:
    registry.3.credential: { client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d }
    gate.ext_authz.listener.tls.client_ca: /etc/tool-approvals/gateway-ca.pem
  expect:
    - "registry.gateway-wait-route: a client-certificate credential, but no listener serving its grants asks for client certificates (tls.client_ca)"

- name: a client certificate where the asking listener has no tls
  set: { registry.3.credential: { client_cert_sha256: 5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d } }
  delete: [wait.listeners.mcp.tls]
  expect:
    - "registry.gateway-wait-route: a client-certificate credential, but no listener serving its grants asks"
    - "wait.listeners.mcp: carries registry bearers, so it needs tls"

- name: every registry-authenticated listener without tls, all listed
  delete:
    - gate.check_api.grpc.tls
    - gate.check_api.json.tls
    - gate.ext_mcp.listener.tls
    - gate.ext_authz.listener.tls
    - wait.listeners.mcp.tls
    - approvals.listeners.requests.tls
    - approvals.listeners.answers_grpc.tls
    - approvals.listeners.answers_json.tls
    - approvals.listeners.admin.tls
  expect:
    - "gate.check_api.grpc: carries registry bearers, so it needs tls"
    - "gate.check_api.json: carries registry bearers, so it needs tls"
    - "gate.ext_mcp.listener: carries registry bearers, so it needs tls"
    - "gate.ext_authz.listener: carries registry bearers, so it needs tls"
    - "wait.listeners.mcp: carries registry bearers, so it needs tls"
    - "approvals.listeners.requests: carries registry bearers, so it needs tls"
    - "approvals.listeners.answers_grpc: carries registry bearers, so it needs tls"
    - "approvals.listeners.answers_json: carries registry bearers, so it needs tls"
    - "approvals.listeners.admin: carries registry bearers, so it needs tls"

# ---- registry kinds and integrated surfaces (the Answers API) ----

- name: a caller granted an answers method
  set: { registry.0.grants: [check, answers.answer] }
  expect: ["registry.gateway-hook: kind caller may not be granted answers.answer"]

- name: a caller granted the audit report
  set: { registry.1.grants: [requests.request, requests.claim, admin.audit] }
  expect: ["registry.gate: kind caller may not be granted admin.audit"]

- name: a surface granted check
  set: { registry.4.grants: [answers.review, answers.answer, check] }
  expect: ["registry.ticketing: kind surface may not be granted check"]

- name: an operator granted an answers method
  set: { registry.5.grants: [admin.audit, answers.review] }
  expect: ["registry.auditor: kind operator may not be granted answers.review"]

- name: a registry kind that is not caller, surface or operator
  set: { registry.4.kind: desk }
  expect: ["registry[4].kind: Input should be 'caller', 'surface' or 'operator'"]

- name: a surface entry naming no integrated surface
  set:
    registry.6:
      name: chat
      kind: surface
      credential: { bearer_sha256: 8192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f70 }
      grants: [answers.review, answers.answer]
  expect: ["registry.chat: kind surface, but no integrated surface is named 'chat'"]

- name: a surface entry naming a native surface
  set: { registry.4.name: desk }
  expect:
    - "registry.desk: kind surface, but no integrated surface is named 'desk'"
    - "surfaces.ticketing: an integrated surface with no registry entry of kind surface"

- name: an integrated surface with no registry entry
  delete: [registry.4]
  expect: ["surfaces.ticketing: an integrated surface with no registry entry of kind surface"]

- name: an integrated surface whose entry is a caller
  set: { registry.4.kind: caller, registry.4.grants: [check] }
  expect: ["surfaces.ticketing: an integrated surface with no registry entry of kind surface"]

- name: one integrated surface with two surface entries
  set:
    registry.6:
      name: ticketing
      kind: surface
      credential: { bearer_sha256: 8192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f70 }
      grants: [answers.review]
  expect: ["registry: the name 'ticketing' is on two entries"]

- name: the Answers API and admin listeners without tls
  delete: [approvals.listeners.answers_grpc.tls, approvals.listeners.answers_json.tls, approvals.listeners.admin.tls]
  expect:
    - "approvals.listeners.answers_grpc: carries registry bearers, so it needs tls"
    - "approvals.listeners.answers_json: carries registry bearers, so it needs tls"
    - "approvals.listeners.admin: carries registry bearers, so it needs tls"

- name: the Answers API's JSON listener alone without tls
  delete: [approvals.listeners.answers_json.tls]
  expect: ["approvals.listeners.answers_json: carries registry bearers, so it needs tls"]

- name: desk.surface naming an integrated surface
  set: { approvals.desk.surface: ticketing }
  expect: ["approvals.desk.surface: 'ticketing' is not a native surface"]

- name: check_budget not below the ext_mcp hook timeout
  set: { gate.check_budget: 10s }
  expect: ["gate.check_budget: not below gate.ext_mcp.hook_timeout"]

- name: check_budget not below either hook timeout
  set: { gate.check_budget: 70s }
  expect:
    - "gate.check_budget: not below gate.ext_mcp.hook_timeout"
    - "gate.check_budget: not below gate.ext_authz.hook_timeout"

- name: ext_authz without hook_timeout
  delete: [gate.ext_authz.hook_timeout]
  expect: ["gate.ext_authz.hook_timeout: Field required"]

- name: lock_timeout more than a quarter of check_budget
  set: { approvals.database.lock_timeout: 2s }
  expect: ["approvals.database.lock_timeout: more than 1/4 of gate.check_budget"]

- name: retention below the longest answer deadline
  set: { approvals.retention: 30m, approvals.delivery.give_up_after: 30m } # a delivery horizon within retention
  expect: ["approvals.retention: below the longest answer_deadline + use_window"]

- name: retention at the answer deadline but below it plus the use window
  set:
    approvals.retention: 1h
    approvals.delivery.give_up_after: 1h
    requirements.reviewed.answer_deadline: 1h
    requirements.reviewed.use_window: 15m
  expect: ["approvals.retention: below the longest answer_deadline + use_window"]

- name: an inline secret
  set: { gate.approvals.credential: not-a-reference }
  expect: ["gate.approvals.credential: a secret is {file: PATH} or {env: NAME}, never inline"]

- name: a secret naming both a file and a variable
  set: { gate.approvals.credential: { env: BEARER, file: /run/secrets/bearer } }
  expect: ["gate.approvals.credential: a secret names exactly one of file or env"]

- name: a duration without a unit
  set: { approvals.retention: 90 }
  expect: ["approvals.retention: a duration is a positive whole number and a unit"]

- name: a zero duration
  set: { requirements.reviewed.use_window: 0s }
  expect: ["requirements.reviewed.use_window: a duration is a positive whole number and a unit"]

- name: a requirement with no approver group
  set: { requirements.reviewed.approver_groups: [] }
  expect: ["requirements.reviewed.approver_groups: empty, so no one can answer it"]

- name: a requirement with no allowed surface
  set: { requirements.reviewed.allowed_surfaces: [] }
  expect: ["requirements.reviewed.allowed_surfaces: empty, so it can be answered nowhere"]

- name: an approver group under a claim the IdP does not send as groups
  set: { requirements.reviewed.approver_groups: [{ claim: roles, value: approvers }] }
  expect: ["requirements.reviewed.approver_groups[0].claim: 'roles', but approvals.idp.groups_claim is 'groups'"]

- name: an unknown key
  set: { gate.listeners.metrics: { host: 0.0.0.0, port: 9090 } }
  expect: ["gate.listeners.metrics: Extra inputs are not permitted"]

- name: an unknown version
  set: { version: 2 }
  expect: ["version: Input should be 1"]

- name: a requirement named like no approval
  set:
    requirements.none: { approver_groups: [], allowed_surfaces: [], min_assurance: passkey, max_sign_in_age: 1m, answer_deadline: 1h, use_window: 1m }
  expect:
    - "requirements.none: 'none' is reserved"
    - "requirements.none.approver_groups: empty"
    - "requirements.none.allowed_surfaces: empty"

- name: problems in several sections, all listed
  set:
    requirements.reviewed.min_assurance: password
    registry.1.credential.bearer_sha256: 1f0b6c6e2a2d4b5f8e9a0c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f7
    gate.policy.default: admin
  expect:
    - "requirements.reviewed: below the floor"
    - "registry: one bearer hash on two entries"
    - "gate.policy.default: unknown requirement 'admin'"

- name: a desk key under 32 bytes once resolved
  command: approvals
  delete: [channels]
  set:
    approvals.database.dsn: { env: DSN }
    approvals.idp.client_secret: { env: IDP_SECRET }
    approvals.desk.session_key: { env: SESSION_KEY }
    approvals.desk.form_key: { env: FORM_KEY }
  env:
    DSN: postgresql://approvals@db.example.com/approvals
    IDP_SECRET: idp-secret
    SESSION_KEY: "0123456789abcdef0123456789abcde"
    FORM_KEY: "0123456789abcdef0123456789abcdef"
  expect: ["approvals.desk.session_key: under 32 bytes once resolved"]

- name: one desk key as both the session key and the form key
  command: approvals
  delete: [channels]
  set:
    approvals.database.dsn: { env: DSN }
    approvals.idp.client_secret: { env: IDP_SECRET }
    approvals.desk.session_key: { env: SESSION_KEY }
    approvals.desk.form_key: { env: FORM_KEY }
  env:
    DSN: postgresql://approvals@db.example.com/approvals
    IDP_SECRET: idp-secret
    SESSION_KEY: "0123456789abcdef0123456789abcdef"
    FORM_KEY: "0123456789abcdef0123456789abcdef"
  expect: ["approvals.desk.form_key: the same as approvals.desk.session_key"]

- name: unresolvable secrets, all listed
  command: approvals
  delete: [channels]
  set:
    approvals.idp.client_secret: { env: IDP_SECRET }
  env: {}
  expect:
    - "approvals.database.dsn: cannot read the file /run/secrets/approvals-dsn"
    - "approvals.idp.client_secret: the environment variable IDP_SECRET is unset or empty"
    - "approvals.desk.session_key: cannot read the file /run/secrets/desk-session-key"
    - "approvals.desk.form_key: cannot read the file /run/secrets/desk-form-key"

- name: the gate's section missing
  command: gate
  delete: [gate]
  expect: ["the gate command needs the 'gate' section"]

- name: the wait server's sections missing
  command: wait
  delete: [wait, wait_route]
  expect: ["the wait command needs the 'wait' section", "the wait command needs the 'wait_route' section"]

- name: Approvals' floor missing
  command: approvals
  delete: [floor]
  expect: ["the approvals serve command needs the 'floor' section"]

- name: the migrate command's section missing
  command: migrate
  delete: [approvals]
  expect: ["the approvals migrate command needs the 'approvals' section"]

- name: the gate's credential unset
  command: gate
  env: {}
  expect: ["gate.approvals.credential: the environment variable GATE_APPROVALS_BEARER is unset or empty"]

# ---- gateway attributes: every attribute a rule reads, mapped by every enabled mapping that maps attributes ----

- name: a rule attribute neither gateway mapping maps
  set: { gate.policy.rules.0.attributes: { region: "north" } }
  expect:
    - "gate.policy.rules[0].attributes.region: not mapped by gate.ext_mcp.attributes"
    - "gate.policy.rules[0].attributes.region: not mapped by gate.ext_authz.attributes"

- name: a rule attribute ext_mcp does not map
  delete: [gate.ext_mcp.attributes.tenant]
  expect: ["gate.policy.rules[1].attributes.tenant: not mapped by gate.ext_mcp.attributes"]

- name: a rule attribute ext_authz does not map
  delete: [gate.ext_authz.attributes.tenant]
  expect: ["gate.policy.rules[1].attributes.tenant: not mapped by gate.ext_authz.attributes"]

- name: a rule attribute no enabled mapping supplies
  delete: [gate.check_api, gate.ext_mcp, gate.ext_authz]
  expect: ["gate.policy.rules[1].attributes.tenant: no enabled mapping supplies it"]

- name: a rule attribute only an unenabled check_api could supply, with ext_mcp not mapping it
  delete: [gate.check_api, gate.ext_authz, gate.ext_mcp.attributes]
  expect:
    - "gate.policy.rules[1].attributes.tenant: not mapped by gate.ext_mcp.attributes"
    - "gate.policy.rules[1].attributes.tenant: no enabled mapping supplies it"

- name: an ext_authz attribute naming both sources
  set: { gate.ext_authz.attributes.zone: { metadata: [envoy.filters.http.jwt_authn, zone], context_extension: zone } }
  expect: ["gate.ext_authz.attributes.zone: an ext_authz attribute names exactly one of metadata or context_extension"]

- name: an ext_authz attribute naming neither source
  set: { gate.ext_authz.attributes.zone: {} }
  expect: ["gate.ext_authz.attributes.zone: an ext_authz attribute names exactly one of metadata or context_extension"]

- name: an ext_authz metadata source without a key after the filter name
  set: { gate.ext_authz.attributes.zone: { metadata: [envoy.filters.http.jwt_authn] } }
  expect: ["gate.ext_authz.attributes.zone.metadata: Tuple should have at least 2 items"]

- name: an ext_mcp attribute with an empty key path
  set: { gate.ext_mcp.attributes.tenant: [] }
  expect: ["gate.ext_mcp.attributes.tenant: Tuple should have at least 1 item"]
